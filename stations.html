<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMORA - Police Stations</title>
    <!-- Path Fixed -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .station-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; }
        .station-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .station-icon { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 8px; font-size: 20px; }
        .station-details p { color: #cbd5e1; font-size: 14px; margin-bottom: 8px; }
        .station-details i { color: #94a3b8; margin-right: 8px; width: 15px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-box">
        <!-- Path Fixed -->
        <img src="assets/images/crimora-logo.jpg" alt="CRIMORA Logo" class="logo">
        <h2>CRIMORA</h2>
        <p>by CyberZyc</p>
    </div>
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="fir.html"><i class="fa-solid fa-file"></i> FIR Management</a>
    <a href="stations.html" style="border-left: 4px solid #38bdf8; background-color: #334155; color: #38bdf8;"><i class="fa-solid fa-building-shield"></i> Police Stations</a>
    <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    <a href="network.html"><i class="fa-solid fa-network-wired"></i> Crime Network</a>
    <a href="police.html"><i class="fa-solid fa-user-shield"></i> Police Personnel</a>
    <a href="reports.html"><i class="fa-solid fa-file-pdf"></i> Reports</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
</div>

<div class="main">
    <div class="topbar">
        <h1>Jurisdiction Police Stations</h1>
        <div id="clock"></div>
    </div>
    <div class="station-grid">
        <div class="station-card">
            <div class="station-header">
                <div class="station-icon"><i class="fa-solid fa-building-shield"></i></div>
                <div><h3 style="color: #f8fafc;">Central Station (J1)</h3><span style="font-size: 12px; color: #4ade80;">Active</span></div>
            </div>
            <div class="station-details">
                <p><i class="fa-solid fa-location-dot"></i> Anna Salai, HQ District</p>
                <p><i class="fa-solid fa-phone"></i> +91 98765 43210</p>
                <p><i class="fa-solid fa-user-tie"></i> Inspector: Rajesh Kumar</p>
            </div>
        </div>
    </div>
</div>

<!-- Path Fixed -->
<script src="js/dashboard.js"></script>
</body>
</html>
