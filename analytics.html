<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMORA - Analytics</title>
    <!-- Path Fixed -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .analytics-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; }
        .chart-card h3 { color: #f8fafc; margin-bottom: 15px; font-weight: 500; font-size: 18px; }
        .chart-placeholder { height: 250px; background: #0f172a; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #64748b; border: 1px dashed #475569; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-box">
        <!-- Path Fixed -->
        <img src="assets/images/crimora-logo.jpg" alt="CRIMORA Logo" class="logo">
        <h2>CRIMORA</h2>
        <p>by CyberZyc</p>
    </div>
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="fir.html"><i class="fa-solid fa-file"></i> FIR Management</a>
    <a href="stations.html"><i class="fa-solid fa-building-shield"></i> Police Stations</a>
    <a href="analytics.html" style="border-left: 4px solid #38bdf8; background-color: #334155; color: #38bdf8;"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    <a href="network.html"><i class="fa-solid fa-network-wired"></i> Crime Network</a>
    <a href="police.html"><i class="fa-solid fa-user-shield"></i> Police Personnel</a>
    <a href="reports.html"><i class="fa-solid fa-file-pdf"></i> Reports</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
</div>

<div class="main">
    <div class="topbar">
        <h1>Intelligence Analytics</h1>
        <div id="clock"></div>
    </div>
    <div class="analytics-grid">
        <div class="chart-card">
            <h3>Crime Rate Trends (Monthly)</h3>
            <div class="chart-placeholder"><i class="fa-solid fa-chart-area" style="font-size: 30px; margin-right: 10px;"></i> [ Chart.js Area Graph ]</div>
        </div>
    </div>
</div>

<!-- Path Fixed -->
<script src="js/dashboard.js"></script>
</body>
</html>
